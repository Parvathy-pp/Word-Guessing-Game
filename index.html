<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Guessing Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <header class="header">
      <h1 class="logo">Word Guessing<span class="logo-accent">_</span></h1>
      <div class="stats">
        <div class="stat">
          <span class="stat-value" id="streak">0</span>
          <span class="stat-label">streak</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="wins">0</span>
          <span class="stat-label">wins</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="losses">0</span>
          <span class="stat-label">losses</span>
        </div>
      </div>
    </header>

    <div class="category-bar">
      <span class="category-label">Category:</span>
      <span id="category-name" class="category-badge">—</span>
    </div>

    <main class="game-area">

      <div class="gallows-wrap">
        <svg class="gallows" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" aria-label="Hangman gallows">
          <!-- Structure -->
          <line x1="20" y1="210" x2="180" y2="210" class="gallows-line" />
          <line x1="60" y1="210" x2="60" y2="20"  class="gallows-line" />
          <line x1="60" y1="20"  x2="130" y2="20"  class="gallows-line" />
          <line x1="130" y1="20" x2="130" y2="45"  class="gallows-line" />
          <!-- Head -->
          <circle cx="130" cy="58" r="13" class="body-part" id="head" />
          <!-- Body -->
          <line x1="130" y1="71" x2="130" y2="130" class="body-part" id="body" />
          <!-- Left arm -->
          <line x1="130" y1="85" x2="105" y2="110" class="body-part" id="left-arm" />
          <!-- Right arm -->
          <line x1="130" y1="85" x2="155" y2="110" class="body-part" id="right-arm" />
          <!-- Left leg -->
          <line x1="130" y1="130" x2="105" y2="160" class="body-part" id="left-leg" />
          <!-- Right leg -->
          <line x1="130" y1="130" x2="155" y2="160" class="body-part" id="right-leg" />
        </svg>

        <div class="attempts-display">
          <span id="attempts-left">10</span>
          <span class="attempts-label"> attempts left</span>
        </div>
      </div>

      <div class="word-section">
        <div class="word-display" id="word-display" aria-live="polite"></div>
        <div class="hint-row">
          <span class="hint-label">Hint:</span>
          <span id="hint-text" class="hint-text">—</span>
        </div>
        <div class="message-area" id="message-area" aria-live="assertive"></div>
      </div>

    </main>

    <div class="wrong-letters-row">
      <span class="wrong-label">Wrong guesses:</span>
      <span id="wrong-letters" class="wrong-letters">—</span>
    </div>

    <div class="keyboard" id="keyboard" aria-label="Letter buttons"></div>

    <div class="controls">
      <button class="btn-new" id="new-game-btn">New game</button>
      <select class="category-select" id="category-select" aria-label="Choose category">
        <option value="all">All categories</option>
        <option value="gen-z">Gen Z slang</option>
        <option value="animals">Animals</option>
        <option value="tech">Tech & code</option>
        <option value="food">Food</option>
        <option value="space">Space</option>
      </select>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
